async function storageGet(key) {
  try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; } catch { return null; }
}
async function storageSet(key, val) {
  try { await window.storage.set(key, JSON.stringify(val)); } catch {}
}

async function askClaude(messages, system='', apiKey=null) {
  if (!apiKey) throw new Error('NO_API_KEY');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,system,messages})
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.content?.[0]?.text || '';
}

async function askClaudeJSON(messages, system='', apiKey=null) {
  const text = await askClaude(messages, system, apiKey);
  const clean = text.replace(/^```(?:json)?\s*/m,'').replace(/\s*```\s*$/m,'').trim();
  return JSON.parse(clean);
}

/* ═══════════════════════════════════════════
   SQLITE EXPORT / IMPORT
═══════════════════════════════════════════ */
async function exportSQLite() {
  try {
    const SQL = await window.initSqlJs({locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`});
    const db = new SQL.Database();
    db.run('CREATE TABLE certifications (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE NOT NULL)');
    db.run('CREATE TABLE questions (id INTEGER PRIMARY KEY AUTOINCREMENT, certification_id INTEGER, question TEXT, option_a TEXT, option_b TEXT, option_c TEXT, option_d TEXT, correct_answer TEXT, explanation TEXT, source_url TEXT, source_name TEXT)');
    for (const [certName, qs] of Object.entries(S.questionBank)) {
      db.run('INSERT OR IGNORE INTO certifications (name) VALUES (?)',[certName]);
      const res = db.exec('SELECT id FROM certifications WHERE name=?',[certName]);
      const certId = res[0].values[0][0];
      for (const q of qs) {
        db.run('INSERT INTO questions (certification_id,question,option_a,option_b,option_c,option_d,correct_answer,explanation,source_url,source_name) VALUES (?,?,?,?,?,?,?,?,?,?)',
          [certId,q.question,q.options?.[0]||'',q.options?.[1]||'',q.options?.[2]||'',q.options?.[3]||'',q.correctAnswer,q.explanation,q.sourceUrl||'',q.sourceName||'']);
      }
    }
    db.run('CREATE TABLE study_plans (id INTEGER PRIMARY KEY AUTOINCREMENT, cert TEXT NOT NULL, plan_json TEXT NOT NULL, progress_json TEXT NOT NULL, created_at TEXT)');
    for (const session of S.sessions) {
      db.run('INSERT INTO study_plans (cert,plan_json,progress_json,created_at) VALUES (?,?,?,?)',
        [session.cert,JSON.stringify(session.plan),JSON.stringify(session.progress||{}),session.createdAt||'']);
    }
    const data = db.export();
    const blob = new Blob([data],{type:'application/x-sqlite3'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`certprep-backup-${Date.now()}.db`; a.click();
    URL.revokeObjectURL(url); db.close();
  } catch(e) {
    setState({bankImportStatus:{loading:false,success:false,message:`Export failed: ${e.message}`}});
  }
}

async function importSQLite(file) {
  setState({bankImportStatus:{loading:true,message:'Importing…'}});
  try {
    const SQL = await window.initSqlJs({locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`});
    const buf = await file.arrayBuffer();
    const db = new SQL.Database(new Uint8Array(buf));
    let qImported=0,qCerts=0,planImported=0;
    try {
      const certs = db.exec('SELECT id, name FROM certifications');
      if (certs.length) {
        const newBank = {...S.questionBank};
        for (const [certId,certName] of certs[0].values) {
          const key = certName.toLowerCase().trim();
          const existing = newBank[key]||[];
          const existingTexts = new Set(existing.map(q=>q.question.toLowerCase()));
          const rows = db.exec('SELECT question,option_a,option_b,option_c,option_d,correct_answer,explanation,source_url,source_name FROM questions WHERE certification_id=?',[certId]);
          if (rows.length) {
            const newQs = rows[0].values.filter(r=>!existingTexts.has(r[0].toLowerCase())).map(r=>({question:r[0],options:[r[1],r[2],r[3],r[4]],correctAnswer:r[5],explanation:r[6],sourceUrl:r[7],sourceName:r[8]}));
            if (newQs.length){newBank[key]=[...existing,...newQs];qImported+=newQs.length;qCerts++;}
          }
        }
        await saveBank(newBank);
      }
    } catch(e){}
    try {
      const plans = db.exec('SELECT cert, plan_json, progress_json, created_at FROM study_plans');
      if (plans.length) {
        const existingIds = new Set(S.sessions.map(s=>s.cert.toLowerCase().trim()));
        const newPlans=[];
        for (const [cert,planJson,progressJson,createdAt] of plans[0].values) {
          if (existingIds.has(cert.toLowerCase().trim())) continue;
          try { newPlans.push({id:Date.now()+Math.random(),cert,plan:JSON.parse(planJson),progress:JSON.parse(progressJson||'{}'),createdAt}); } catch(e){}
        }
        if (newPlans.length){await saveSessions([...newPlans,...S.sessions]);planImported=newPlans.length;}
      }
    } catch(e){}
    db.close();
    const parts=[];
    if (qImported>0) parts.push(`${qImported} questions across ${qCerts} cert(s)`);
    if (planImported>0) parts.push(`${planImported} study plan(s)`);
    if (!parts.length) parts.push('Nothing new to import (all already present)');
    setState({bankImportStatus:{loading:false,success:true,message:`Imported: ${parts.join(' · ')}`}});
  } catch(e) {
    setState({bankImportStatus:{loading:false,success:false,message:`Import failed: ${e.message}`}});
  }
}

/* ═══════════════════════════════════════════
   QUESTION BANK
═══════════════════════════════════════════ */
function addToBank(certName, newQs) {
  const key = certName.toLowerCase().trim();
  const existing = S.questionBank[key]||[];
  const existingTexts = new Set(existing.map(q=>q.question.toLowerCase()));
  const unique = newQs.filter(q=>!existingTexts.has(q.question.toLowerCase()));
  if (!unique.length) return 0;
  const updated = {...S.questionBank,[key]:[...existing,...unique]};
  saveBank(updated);
  setState({saveNote:`+${unique.length} saved to question bank (${updated[key].length} total)`});
  setTimeout(()=>setState({saveNote:''}),2500);
  return unique.length;
}
function getBankQuestions(certName) {
  return S.questionBank[certName.toLowerCase().trim()]||[];
}

═══════════════════════════════════════════ */
async function handleStartPlan() {
  const cert = S.certInput.trim();
  if (!cert) return;
  if (!S.apiKey) {
    setState({tempApiKey:'',showApiModal:true});
    return;
  }
  setState({genError:'',genStatus:`Researching ${cert}...`,view:'generating'});
  const system='You are an expert certification coach. Return ONLY a single valid JSON object with no markdown, no code fences, no explanation.';
  const prompt=`Create a study plan for the certification: "${cert}"\n\nReturn ONLY this JSON, no markdown:\n{"cert":"${cert}","overview":"2-3 sentence description","examInfo":{"duration":"...","questions":"...","passingScore":"...","cost":"...","validity":"..."},"topics":[{"id":"topic-1","title":"...","weight":"20%","description":"1-2 sentences","subtopics":["...","..."],"resources":[{"type":"official","title":"...","url":"https://...","description":"..."},{"type":"free","title":"...","url":"https://...","description":"..."},{"type":"video","title":"...","url":"https://youtube.com","description":"..."}],"estimatedHours":5}],"studyPlan":{"totalWeeks":8,"weeklyHours":10,"phases":[{"phase":1,"name":"...","weeks":"1-2","focus":"...","topics":["topic-1"]}]},"tips":["...","...","..."]}\nInclude 4-6 realistic topics for "${cert}".`;
  try {
    setState({genStatus:'Building your personalized study plan...'});
    const plan = await askClaudeJSON([{role:'user',content:prompt}],system,S.apiKey);
    if (!plan?.topics) throw new Error('Unexpected response. Please try again.');
    const curated = getMsfthubResources(cert);
    if (curated) {
      plan.topics = plan.topics.map((topic,i)=>({
        ...topic,
        resources: i===0 ? [...curated.slice(0,4),...(topic.resources||[])]
          : [{type:'official',title:`MSFTHub ${cert.toUpperCase()} Resources`,url:getMsfthubUrl(cert),description:'Community-curated study materials for this exam'},...(topic.resources||[])]
      }));
    }
    const session={id:Date.now(),cert:plan.cert||cert,plan,progress:{},createdAt:new Date().toISOString()};
    const newSessions=[session,...S.sessions];
    await saveSessions(newSessions);
    setState({activeSession:session,certInput:'',view:'dashboard'});
  } catch(err) {
    setState({genError:err.message||'Something went wrong. Please try again.'});
  }
}

async function generateQBatch(certName,count,startId,existing=[],recentOnly=false,signal=null) {
  const avoid = existing.length ? `\nAvoid these topics: ${existing.map(q=>q.question.substring(0,40)).join('; ')}` : '';
  const recent = recentOnly ? '\nFocus ONLY on features/updates from the last 12 months (2024-2025).' : '';
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',signal,
    headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,messages:[{role:'user',content:`Generate exactly ${count} multiple choice practice questions for the "${certName}" certification exam. Start numbering from ${startId}.\n\nReturn ONLY a valid JSON array, no markdown:\n[{"id":${startId},"question":"...","options":["A) ...","B) ...","C) ...","D) ..."],"correctAnswer":"A","explanation":"...","sourceUrl":"https://...","sourceName":"..."}]\n\nMake questions realistic and exam-relevant. Vary difficulty.${recent}${avoid}`}]})
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data=await res.json();
  if (data.error) throw new Error(data.error.message);
  const text=data.content[0].text;
  return JSON.parse(text.replace(/^```(?:json)?\s*/m,'').replace(/\s*```\s*$/m,'').trim());
}

async function startQuiz() {
  const cert=(S.quizCert.trim()||S.activeSession?.cert||'');
  if (!cert){setState({quizError:'Enter a certification name.'});return;}
  const saved=getBankQuestions(cert);
  if (S.quizSource!=='saved'&&!S.apiKey){setState({tempApiKey:'',showApiModal:true});return;}
  if (S.quizSource==='saved'&&!saved.length){setState({quizError:'No saved questions for this cert. Generate new ones first.'});return;}
  if (S._abort) S._abort.abort();
  const ctrl=new AbortController();
  setState({_abort:ctrl,quizLoading:true,quizError:'',questions:[],userAnswers:{},currentQ:0,quizView:'active'});
  try {
    if (S.quizSource==='saved'){
      const shuffled=[...saved].sort(()=>Math.random()-0.5).slice(0,S.quizCount);
      setState({questions:shuffled.map((q,i)=>({...q,id:i+1})),quizLoading:false});
      return;
    }
    let fromSaved=[],toGenerate=S.quizCount;
    if (S.quizSource==='mixed'&&saved.length>0){
      const max=Math.min(Math.floor(S.quizCount*0.5),saved.length);
      fromSaved=[...saved].sort(()=>Math.random()-0.5).slice(0,max);
      toGenerate=S.quizCount-fromSaved.length;
    }
    const firstSize=Math.min(5,toGenerate);
    const firstBatch=await generateQBatch(cert,firstSize,1,[],S.quizFocusRecent,ctrl.signal);
    let allNew=[...firstBatch];
    addToBank(cert,firstBatch);
    setState({questions:[...fromSaved,...allNew].map((q,i)=>({...q,id:i+1})),quizLoading:false});
    const remaining=toGenerate-firstSize;
    if (remaining>0){
      setState({quizLoadingMore:true},true);
      let left=remaining;
      while (left>0&&!ctrl.signal.aborted){
        const batchSize=Math.min(5,left);
        try {
          const batch=await generateQBatch(cert,batchSize,allNew.length+1,allNew,S.quizFocusRecent,ctrl.signal);
          if (Array.isArray(batch)){allNew=[...allNew,...batch];addToBank(cert,batch);setState({questions:[...fromSaved,...allNew].map((q,i)=>({...q,id:i+1}))});}
        } catch(e){if(e.name==='AbortError')break;}
        left-=batchSize;
      }
      setState({quizLoadingMore:false});
    }
  } catch(err){
    if (err.name==='AbortError') return;
    setState({quizError:`Failed: ${err.message}`,quizLoading:false,quizLoadingMore:false,quizView:'setup'});
  }
}

function handleAnswer(qId,answer) {
  if (S.userAnswers[qId]) return;
  setState({userAnswers:{...S.userAnswers,[qId]:answer}});
}

function calcScore(){return S.questions.filter(q=>S.userAnswers[q.id]===q.correctAnswer).length;}

async function toggleTopicDone(topicId) {
  const prog={...S.activeSession.progress,[topicId]:{...S.activeSession.progress[topicId],done:!S.activeSession.progress[topicId]?.done}};
  const updated={...S.activeSession,progress:prog};
  setState({activeSession:updated});
  await saveSessions(S.sessions.map(s=>s.id===updated.id?updated:s));
}

/* ═══════════════════════════════════════════
   RENDER HELPERS
═══════════════════════════════════════════ */
function h(tag,attrs,...children){
  const el=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==='class') el.className=v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if (k==='html') el.innerHTML=v;
    else if (k==='style'&&typeof v==='object') Object.assign(el.style,v);
    else el.setAttribute(k,v);
  }
  for (const c of children.flat(99)){
    if (c==null||c===false) continue;
    el.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  }
  return el;
}
function txt(s){return document.createTextNode(s);}
function frag(...children){
  const f=document.createDocumentFragment();
  for (const c of children.flat(99)){
    if (c==null||c===false) continue;
    f.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(c):c);
  }
  return f;
}

function renderQuizActive(){
  if (S.quizLoading&&S.questions.length===0) return h('div',{class:'center'},
    h('div',{style:{textAlign:'center',padding:'40px'}},
      h('div',{class:'gen-spinner'}),
      h('h2',{style:{fontSize:'22px',fontWeight:'700',marginBottom:'10px'}},'Generating questions…'),
      h('p',{style:{color:'#6b748a',fontSize:'13px'}},'First batch in ~10 seconds')
    )
  );
  const cq=S.questions[S.currentQ];
  if (!cq) return null;
  const hasAnswered=S.userAnswers[cq.id]!==undefined;
  const showFeedback=hasAnswered&&S.quizMode==='training';
  const isCorrect=hasAnswered&&S.userAnswers[cq.id]===cq.correctAnswer;
  const allAnswered=Object.keys(S.userAnswers).length>=S.questions.length;

  return h('div',{class:'page'},
    h('div',{class:'flex',style:{justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}},
      h('button',{class:'btn-back',style:{padding:'0'},onClick:()=>{S._abort?.abort();setState({quizView:'setup'});}},'\u2190 Exit'),
      h('div',{class:'flex gap-12',style:{alignItems:'center'}},
        S.quizLoadingMore&&h('span',{style:{fontSize:'12px',color:'#4f8ef7'}},'⟳ Loading more…'),
        S.saveNote&&h('span',{style:{fontSize:'12px',color:'#3dd68c'}},S.saveNote),
        allAnswered&&h('button',{class:'btn-primary',onClick:()=>setState({quizView:'results'})},'See Results →')
      )
    ),
    h('div',{class:'quiz-card'},
      h('div',{class:'flex',style:{justifyContent:'space-between',marginBottom:'10px'}},
        h('span',{style:{fontSize:'12px',color:'#4f8ef7',fontWeight:'700',textTransform:'uppercase',letterSpacing:'1px'}},S.quizCert||S.activeSession?.cert),
        h('span',{style:{fontSize:'12px',color:'#6b748a'}},(S.currentQ+1)+'/'+S.questions.length+(S.quizLoadingMore?' (loading more)':''))
      ),
      h('div',{style:{height:'4px',background:'#1e2535',borderRadius:'4px',overflow:'hidden',marginBottom:'24px'}},
        h('div',{class:'progress-bar',style:{width:(S.currentQ/S.questions.length*100)+'%',transition:'width .4s'}})
      ),
      h('p',{style:{fontSize:'18px',fontWeight:'600',lineHeight:'1.5',marginBottom:'22px'}},cq.question),
      h('div',{class:'flex-col gap-10'},
        ...cq.options.map((opt,i)=>{
          const letter=['A','B','C','D'][i];
          let cls='opt-btn';
          if (hasAnswered){
            if (letter===cq.correctAnswer) cls+=' correct';
            else if (letter===S.userAnswers[cq.id]) cls+=' wrong';
            else cls+=' faded';
          }
          return h('button',{class:cls,disabled:hasAnswered,onClick:()=>handleAnswer(cq.id,letter)},
            h('span',{class:'opt-letter'},letter),
            h('span',{},opt.replace(/^[ABCD]\)\s*/,''))
          );
        })
      ),
      showFeedback&&h('div',{style:{background:'#080b12',border:'1px solid #1e2535',borderRadius:'10px',padding:'12px 16px',marginTop:'18px',fontSize:'13px',lineHeight:'1.6'}},
        h('strong',{style:{color:isCorrect?'#3dd68c':'#f06a6a'}},isCorrect?'✓ Correct — ':'✗ Incorrect — '),
        cq.explanation,
        cq.sourceUrl&&h('div',{style:{marginTop:'6px'}},h('a',{href:cq.sourceUrl,target:'_blank',style:{color:'#4f8ef7',fontSize:'12px'}},'📎 '+(cq.sourceName||'Source')+' ↗'))
      ),
      h('div',{class:'flex',style:{justifyContent:'space-between',marginTop:'20px'}},
        h('button',{class:'btn-secondary',disabled:S.currentQ===0,onClick:()=>setState({currentQ:S.currentQ-1})},'← Prev'),
        h('button',{class:'btn-primary',disabled:S.currentQ>=S.questions.length-1,onClick:()=>setState({currentQ:S.currentQ+1})},'Next →')
      )
    ),
    h('div',{style:{display:'flex',flexWrap:'wrap',gap:'4px',marginTop:'16px',justifyContent:'center'}},
      ...S.questions.map((q,i)=>{
        const ans=S.userAnswers[q.id];
        const color=!ans?'#1e2535':ans===q.correctAnswer?'#3dd68c':'#f06a6a';
        return h('div',{class:'nav-dot',style:{background:i===S.currentQ?'#4f8ef7':color},onClick:()=>setState({currentQ:i})});
      })
    )
  );
}

              ),
              h('div',{class:'flex-col gap-8'},
                ...qs.slice(0,3).map((q,i)=>h('div',{style:{background:'#080b12',borderRadius:'8px',padding:'8px 12px',fontSize:'12px',color:'#6b748a',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},h('span',{style:{color:'#4f8ef7',marginRight:'8px'}},'Q'+(i+1)),q.question)),
                qs.length>3&&h('div',{style:{fontSize:'11px',color:'#6b748a',paddingLeft:'4px'}},`+${qs.length-3} more questions…`)
              )
            ))
          ),
      h('div',{style:{marginTop:'20px',padding:'16px 20px',background:'rgba(79,142,247,0.04)',border:'1px solid #1e2535',borderRadius:'12px',fontSize:'12px',color:'#6b748a',lineHeight:'1.7'}},
        h('strong',{style:{color:'#dde3f0'}},'About the question bank'),h('br'),
        'Questions are auto-saved as you generate quizzes. Export includes your question bank and all study plans as a single .db SQLite file. Import merges everything — duplicates and existing plans are skipped.'
      )
    )
  );
}

/* ═══════════════════════════════════════════
   MAIN RENDER
═══════════════════════════════════════════ */
function render(){
  const app=document.getElementById('app');
  app.innerHTML='';

  if (S.view==='loading'){app.append(renderLoading());return;}
  if (S.showApiModal){app.append(renderApiModal());return;}
  if (S.view==='generating'){app.append(renderGenerating());return;}

  if (S.view==='home'){app.append(renderHome());return;}
  if (S.view==='dashboard'&&S.activeSession){app.append(renderDashboard());return;}
  if (S.view==='topic'&&S.activeTopic){app.append(renderTopic());return;}
  if (S.view==='bank'){app.append(renderBank());return;}
  if (S.view==='quiz'){
    if (S.quizView==='setup') app.append(renderQuizSetup());
    else if (S.quizView==='active') app.append(renderQuizActive());
    else if (S.quizView==='results') app.append(renderQuizResults());
    else if (S.quizView==='review') app.append(renderQuizReview());
    return;
  }
  // fallback
  setState({view:'home'});
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
(async()=>{
  const saved=await storageGet('cert-sessions-v2');
  if (saved) S.sessions=saved;
  const bank=await storageGet('cert-quiz-bank');
  if (bank) S.questionBank=bank;
  const key=await storageGet('cert-api-key');
  if (key) S.apiKey=key;
  setState({view:'home'});
})();
</script>
